    <text x="155" y="340"><tspan fill="#8b7cff">func</tspan><tspan fill="#ffd76b"> ship</tspan><tspan fill="#aab3c5">() </tspan><tspan fill="#8b7cff">async</tspan><tspan fill="#aab3c5"> -&gt; </tspan><tspan fill="#5ee1ff">Release</tspan><tspan fill="#aab3c5"> {</tspan></text>
