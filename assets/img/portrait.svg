  <g font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="16">
    <text x="133" y="240"><tspan fill="#8b7cff">final class</tspan><tspan fill="#5ee1ff"> Engineer</tspan><tspan fill="#aab3c5"> {</tspan></text>
    <text x="155" y="270"><tspan fill="#8b7cff">let</tspan><tspan fill="#e8ecf4"> name</tspan><tspan fill="#aab3c5"> = </tspan><tspan fill="#7ce38b">"Ali Zaghloul"</tspan></text>
